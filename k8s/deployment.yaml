apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-network-backend
  namespace: production
  labels:
    app.kubernetes.io/name: social-network-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: social-network-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social-network-backend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: social-network-backend
      containers:
        - name: backend
          image: ghcr.io/subvincdebian/social-network-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: social-network-frontend
  namespace: production
  labels:
    app.kubernetes.io/name: social-network-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: social-network-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: social-network-frontend
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: social-network-frontend
      containers:
        - name: frontend
          image: ghcr.io/subvincdebian/social-network-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
