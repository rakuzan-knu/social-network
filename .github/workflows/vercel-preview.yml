name: Vercel Preview

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/src/**'
      - 'frontend/package*.json'
      - 'frontend/vite.config.ts'
      - 'frontend/public/**'
      - 'vercel.json'

concurrency:
  group: vercel-preview-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  deploy-preview:
    name: Vercel — Deploy Preview
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install root deps
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma Client
        run: pnpm --filter backend exec prisma generate

      - name: Build monorepo
        working-directory: ./
        run: pnpm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL_PREVIEW || 'https://api.socialnetwork.dev' }}

      - name: Deploy to Vercel (Preview)
        if: env.VERCEL_TOKEN != ''
        id: vercel-deploy
        uses: amondnet/vercel-action@16e87c0a08142b0d0d33b76aeaf20823c381b9b9 # v25.0.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-version: 'latest'
          working-directory: ./
          github-comment: false

      - name: Post or Update preview URL in PR
        if: env.VERCEL_TOKEN != '' && steps.vercel-deploy.outputs.preview-url != ''
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.vercel-deploy.outputs.preview-url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const url = process.env.PREVIEW_URL;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const tag = '<!-- vercel-preview-comment -->';

            const body = [
              tag,
              '## Vercel Preview Deployment',
              '',
              '| | |',
              '|---|---|',
              `| **Preview URL** | [${url}](${url}) |`,
              `| **Commit** | \`${sha}\` |`,
              `| **Status** | Ready |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
            });

            const botComment = comments.find(c => c.body?.includes(tag));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body,
              });
            }